name: Release & Publish to npm

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-npm-${{ github.ref_name || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-npm:
    name: Build Binary & Publish to npm
    runs-on: ubuntu-22.04
    environment: settings-tui-github-actions
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: |
          cargo build --release --all-features
          strip target/release/settings-tui
          cp target/release/settings-tui bin/settings-tui
          chmod +x bin/settings-tui bin/settings-tui.js

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Publish to npm (Trusted Publishing / OIDC)
        run: |
          CURRENT_VER=$(node -p "require('./package.json').version")
          if npm view settings-tui@"$CURRENT_VER" version >/dev/null 2>&1; then
            echo "settings-tui@$CURRENT_VER is already published on npm. Skipping publish step."
          else
            npx npm@latest publish --provenance --access public || {
              if npm view settings-tui@"$CURRENT_VER" version >/dev/null 2>&1; then
                echo "settings-tui@$CURRENT_VER is already published on npm. Continuing."
              else
                exit 1
              fi
            }
          fi

      - name: Upload Release Tarball to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_VER=$(node -p "require('./package.json').version")
          TARBALL="settings-tui-v${CURRENT_VER}-x86_64-unknown-linux-gnu.tar.gz"
          tar -czf "$TARBALL" -C bin settings-tui
          sha256sum "$TARBALL" > "$TARBALL.sha256"
          if gh release view "v${CURRENT_VER}" >/dev/null 2>&1; then
            gh release upload "v${CURRENT_VER}" "$TARBALL" "$TARBALL.sha256" --clobber
          fi

