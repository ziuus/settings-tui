name: Release & Publish to npm

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-npm:
    name: Build Binary & Publish to npm
    runs-on: ubuntu-latest
    environment: settings-tui-github-actions
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: |
          cargo build --release --all-features
          strip target/release/settings-tui
          cp target/release/settings-tui bin/settings-tui
          chmod +x bin/settings-tui bin/settings-tui.js

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm (Trusted Publishing / OIDC)
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "Publishing with token..."
            npm publish --provenance --access public
          else
            echo "Publishing via npm Trusted Publisher (OIDC token exchange)..."
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
