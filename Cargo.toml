[package]
name = "settings-tui"
version = "0.1.3"
edition = "2021"
description = "A production-grade universal Linux Settings Center for the terminal."

[dependencies]
ratatui = { version = "0.26", features = ["crossterm"] }
crossterm = "0.27"
tokio = { version = "1", features = ["full"] }
zbus = "4.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
futures = "0.3"
sysinfo = "0.30"
async-trait = "0.1"
