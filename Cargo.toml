[package]
name = "settings-tui"
version = "0.1.8"
edition = "2021"
description = "A hyper-lightweight (near 0% CPU, <9MB) universal Linux Settings Center for the terminal."

[dependencies]
ratatui = { version = "0.26", features = ["crossterm"] }
crossterm = "0.27"
tokio = { version = "1", features = ["full"] }
zbus = "4.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
futures = "0.3"
sysinfo = "0.30"
async-trait = "0.1"
reqwest = { version = "0.13.5", features = ["json"] }
uuid = { version = "1.27.0", features = ["v4"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
